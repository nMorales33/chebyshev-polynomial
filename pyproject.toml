[project]
name = "chebyshev-polynomial"
version = "0.1.0"
description = "Evaluates Chebyshev polynomials of the first and second kind via the three-term recurrence for approximation and interpolation."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
